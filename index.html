a.lnk{color:var(--c);cursor:pointer;font-size:13px}

.doc h2{margin:0 0 2px;font-size:22px;color:#1a1a2e}
.doc .sub{color:#666;font-size:13px;margin:0 0 14px}

.doc th{background:#1a1a2e;color:#fff;padding:8px;text-align:right}
.doc td{padding:8px;border-bottom:1px solid #e3e7f0;color:#222}
.doc tr:nth-child(even) td{background:#f8f9fc}

</style></head><body>

const COUNTRIES={'الكويت':{code:'KWD',decimals:3,major:'دينار كويتي',minor:'فلس',minorPerMajor:1000,vat:false},
 'مصر':{code:'EGP',decimals:2,major:'جنيه مصري',minor:'قرش',minorPerMajor:100,vat:true,vatDefault:14},

function numToWords(n){if(n==0)return 'صفر';
 const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'],teens=['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'],
 tens=['','عشرة','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'],hundreds=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'],scales=['','ألف','مليون','مليار'];
 function three(num){let h=Math.floor(num/100),r=num%100,parts=[];if(h)parts.push(hundreds[h]);
  if(r>=10&&r<20)parts.push(teens[r-10]);else{let t=Math.floor(r/10),o=r%10,sub=[];if(o)sub.push(ones[o]);if(t)sub.push(tens[t]);if(sub.length)parts.push(sub.join(' و'))}
  return parts.join(' و')}
 let groups=[],x=Math.floor(n);while(x>0){groups.push(x%1000);x=Math.floor(x/1000)}
 let words=[];for(let i=groups.length-1;i>=0;i--){if(groups[i]==0)continue;let g=three(groups[i]);
  if(i>0){if(groups[i]==1)g=scales[i];else if(groups[i]==2)g=scales[i]=='ألف'?'ألفان':'مليونان';else g=g+' '+scales[i]}
  words.push(g)}
 return words.reverse().join(' و')}

 let s='فقط '+numToWords(major)+' '+CURR.major;if(minor>0)s+=' و'+numToWords(minor)+' '+CURR.minor;return s+' لا غير'}

 const{error:e2}=await sb.rpc('join_company',{p_code:$('cc').value.trim(),p_name:$('nm').value});if(e2)return $('msg').textContent=e2.message;init()}

 const{data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();
 if(!p){$('msg').textContent='أكمل التسجيل بكود الشركة أو سجّل شركة جديدة';sw(1);return}
 if(p.role=='superadmin'){me=p;$('login').hidden=true;$('app').hidden=false;$('who').textContent=p.name+' — مسؤول النظام';$('coname').textContent='';await loadAdmin();$('nav').innerHTML='';renderAdmin();return}
 if(!p.active){showPending('حسابك بانتظار تفعيل المدير. راجع مديرك ليفعّله ويحدد دورك.');return}
 const{data:c}=await sb.from('companies').select('*').eq('id',p.company_id).single();
 CURR=COUNTRIES[c.country]||COUNTRIES['الكويت'];
 if(c.status=='pending')return showPending('طلب تسجيل شركتك قيد المراجعة من إدارة النظام. سنتواصل معك قريباً.');

 if(c.status=='trial'&&c.trial_until&&c.trial_until<today())return showPending('انتهت فترتك التجريبية (7 أيام). تواصل مع الدعم للاشتراك الدائم.');
 me=p;co=c;$('login').hidden=true;$('app').hidden=false;$('who').textContent=p.name+' — '+RN[p.role];
 $('coname').textContent=c.name+(c.status=='trial'?' (تجربة حتى '+c.trial_until+')':'');await load();
 $('nav').innerHTML='';TABS.filter(t=>t[2].includes(me.role[0])).forEach((t,i)=>{const b=document.createElement('button');b.textContent=t[1];b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');t[3]()};$('nav').append(b);if(!i)b.click()})}

/* ================= لوحة مسؤول النظام ================= */
async function loadAdmin(){const{data}=await sb.from('companies').select('*').order('created_at',{ascending:false});D.__companies=data||[];
 const{data:st}=await sb.rpc('admin_company_stats');D.__stats=st||[]}

 out(`<div class="card"><h3>طلبات بانتظار الموافقة (${pend.length})</h3>${pend.length?tbl(['الشركة','تاريخ الطلب',''],pend.map(c=>[esc(c.name),new Date(c.created_at).toLocaleDateString('ar'),
  `<button onclick="adminAct('${c.id}','active')">✅ قبول دائم</button> <button onclick="adminAct('${c.id}','trial',7)">🕐 تجربة 7 أيام</button> <button onclick="adminAct('${c.id}','rejected')">❌ رفض</button>`])):'<p>لا توجد طلبات جديدة.</p>'}</div>

/* ================= لوحة مالية مبسّطة ================= */
function insights(){const c=calc('',today());const lines=[];
 lines.push(c.net>=0?`✅ الوضع جيد: صافي الربح الإجمالي حتى الآن <b>${f(c.net)}</b>`:`⚠️ خسارة: صافي الخسارة الإجمالي حتى الآن <b>${f(Math.abs(c.net))}</b>`);
 const old=D.invoices.filter(v=>v.kind=='sale'&&v.method=='credit'&&invRemaining(v)>0&&(new Date()-new Date(v.date))/86400000>90);
 if(old.length)lines.push(`⚠️ عندك ${old.length} فاتورة آجلة متأخرة أكتر من 90 يوم بإجمالي <b>${f(old.reduce((s,v)=>s+invRemaining(v),0))}</b> — تابعها بسرعة`);
 if(c.rev>0&&c.ex/c.rev>0.4)lines.push('⚠️ المصروفات مرتفعة نسبياً مقارنة بالمبيعات، راجعها');

 return `<div class="card"><h3>الوضع المالي المبسّط</h3>${lines.map(l=>'<p>'+l+'</p>').join('')}<p style="color:var(--m);font-size:12px">هذه مؤشرات آلية للمساعدة، وليست بديلاً عن استشارة محاسب لأي قرار مهم.</p></div>`}

function impXlsx(){const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls,.csv';
 inp.onchange=async()=>{const wb=XLSX.read(await inp.files[0].arrayBuffer());const sheet=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(sheet,{defval:''});const cols=XLSX.utils.sheet_to_json(sheet,{header:1});
  const pick=(o,keys)=>{for(const k of Object.keys(o)){const kk=k.trim().toLowerCase();if(keys.includes(kk))return o[k]}return''};
  let items=rows.map(r=>({company_id:me.company_id,name:pick(r,['الاسم','اسم','name','اسم الصنف','product'])||'',unit:pick(r,['الوحدة','وحدة','unit'])||'قطعة',price:+(pick(r,['السعر','سعر','price','سعر البيع'])||0)})).filter(x=>x.name);
  if(!items.length&&cols.length)items=cols.slice(1).filter(r=>r&&r[0]).map(r=>({company_id:me.company_id,name:String(r[0]),unit:'قطعة',price:+(r[1]||0)}));
  if(!items.length)return alert('لم يتم العثور على بيانات صالحة. تأكد أن أول عمود هو الاسم، والثاني السعر.');
  const{error}=await sb.from('items').insert(items);if(error)return alert(error.message);await load();crud('items')};inp.click()}

function journal(from,to){const J=[],ok=d=>(!from||d>=from)&&(!to||d<=to),ac=m=>m=='cash'?'الصندوق':(m=='knet'||m=='card')?'البنك':0,pt=id=>(D.partners.find(p=>p.id==id)||{}).kind;

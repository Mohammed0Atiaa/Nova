.card{background:#ffffff0d;border:1px solid #22e3ff40;border-radius:16px;padding:16px;margin:12px 0;backdrop-filter:blur(14px)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin:10px 0}
label{display:flex;flex-direction:column;gap:4px;color:var(--m);font-size:13px}
input,select,button,textarea{font:inherit;padding:9px;border-radius:9px;border:1px solid #22e3ff44;background:#0a1030;color:var(--t)}
button{cursor:pointer}button.go{padding:10px 18px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ffffff14;text-align:right}th{color:var(--c)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.k{font-size:26px;color:var(--c)}

.tag{background:#ff7a9022;color:#ff7a90;padding:2px 8px;border-radius:6px;font-size:12px}

.doc table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
.doc th{background:#1a1a2e;color:#fff;padding:8px;text-align:right}
.doc td{padding:8px;border-bottom:1px solid #e3e7f0;color:#222}
.doc tr:nth-child(even) td{background:#f8f9fc}
.doc .tot{display:flex;justify-content:flex-end;margin-top:8px}
.doc .tot table{width:auto;min-width:220px}

.doc .sign{display:flex;justify-content:space-between;margin-top:24px;font-size:13px;color:#444}
.doc .foot{margin-top:20px;color:#999;font-size:12px;text-align:center;border-top:1px dashed #ddd;padding-top:10px}
.docwrap .np{max-width:780px;margin:8px auto 0;display:flex;gap:8px;flex-wrap:wrap}

.inv-box p b{color:#888;font-weight:normal;min-width:55px;font-size:12px}
.inv-items{width:100%;border-collapse:collapse;margin:18px 0}
.inv-items th{background:#0b3;color:#fff;padding:12px 10px;text-align:right;font-size:13px;font-weight:600}
.inv-items td{padding:11px 10px;border-bottom:1px solid #eaeef5;font-size:13px;color:#222}
.inv-items tr:nth-child(even) td{background:#fafbfd}
.inv-items .sku{color:#888;font-size:11px}
.inv-totals{display:flex;justify-content:flex-start;margin-top:10px}
.inv-totals table{min-width:300px;border-collapse:collapse}
.inv-totals td{padding:7px 12px;font-size:13.5px;border:0}
.inv-totals td:first-child{color:#666;text-align:right}
.inv-totals td:last-child{text-align:left;font-weight:600;color:#222}
.inv-totals .grand td{font-size:17px;font-weight:bold;color:#0b3;border-top:2px solid #0b3;padding-top:12px;margin-top:6px}
.inv-totals .paid td{color:#0a8}
.inv-totals .rem td{color:#c00}
.inv-tafqeet{background:#f0fff8;border-right:4px solid #0b3;padding:12px 16px;margin:18px 0;font-size:13px;color:#0b3;border-radius:6px;font-weight:500}
.inv-signs{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin:36px 0 24px;padding-top:18px;border-top:1px dashed #ddd}
.inv-signs .sign{text-align:center}
.inv-signs .sign .space{height:44px}
.inv-signs .sign .line{border-top:1px solid #555;padding-top:8px;font-size:12px;color:#555}
.inv-foot{text-align:center;padding-top:14px;border-top:2px solid #0b5;margin-top:20px;font-size:12px;color:#666;line-height:1.7}
.inv-foot b{color:#0b3;font-size:13px}
.inv-notes{margin:14px 0;padding:10px 14px;background:#fffbeb;border-right:3px solid #f5a623;border-radius:6px;font-size:12px;color:#8a6d1a}
@media print{.inv{box-shadow:none;padding:20px;max-width:100%}}
</style></head><body>

<script>
const SB_URL='https://xyrxmxydbsxfjvsgehel.supabase.co',SB_KEY='sb_publishable_ImWPCq_gkN0OXCVjJx8Ekg_QGjEpA6B';
const sb=supabase.createClient(SB_URL,SB_KEY),$=i=>document.getElementById(i);
const COUNTRIES={'الكويت':{code:'KWD',dial:'965',decimals:3,major:'دينار كويتي',minor:'فلس',minorPerMajor:1000,vat:false},
 'مصر':{code:'EGP',dial:'20',decimals:2,major:'جنيه مصري',minor:'قرش',minorPerMajor:100,vat:true,vatDefault:14},

// ================== تفقيط ==================
function numToWords(n){if(n==0)return 'صفر';
 const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'],teens=['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'],
 tens=['','عشرة','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'],hundreds=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'],scales=['','ألف','مليون','مليار'];
 function three(num){let h=Math.floor(num/100),r=num%100,parts=[];if(h)parts.push(hundreds[h]);
  if(r>=10&&r<20)parts.push(teens[r-10]);else{let t=Math.floor(r/10),o=r%10,sub=[];if(o)sub.push(ones[o]);if(t)sub.push(tens[t]);if(sub.length)parts.push(sub.join(' و'))}
  return parts.join(' و')}
 let groups=[],x=Math.floor(n);while(x>0){groups.push(x%1000);x=Math.floor(x/1000)}
 let words=[];for(let i=groups.length-1;i>=0;i--){if(groups[i]==0)continue;let g=three(groups[i]);
  if(i>0){if(groups[i]==1)g=scales[i];else if(groups[i]==2)g={ألف:'ألفان',مليون:'مليونان',مليار:'ملياران'}[scales[i]]||scales[i];else g=g+' '+scales[i]}
  words.push(g)}
 return words.join(' و')}

 const{error:e2}=await sb.rpc('create_company_self',{p_company:$('cn3').value,p_owner_name:$('nm3').value,p_phone:$('ph3').value});if(e2)return $('msg').textContent=e2.message;init()}

 const{data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();
 if(!p){$('msg').textContent='أكمل التسجيل بكود الشركة أو سجّل شركة جديدة';sw(1);return}

 const{data:c}=await sb.from('companies').select('*').eq('id',p.company_id).single();

 if(c.status=='pending')return showPending('طلب تسجيل شركتك قيد المراجعة من إدارة النظام. سنتواصل معك قريباً.');

 if(c.status=='trial'&&c.trial_until&&c.trial_until<today())return showPending('انتهت فترتك التجريبية (7 أيام). تواصل مع الدعم للاشتراك الدائم.');

// إصلاح 4 & 11: journal يستخدم items.cost + الدفعات للشراء
function journal(from,to){
 const J=[],ok=d=>(!from||d>=from)&&(!to||d<=to);
 const ac=m=>m=='cash'?'الصندوق':(m=='knet'||m=='card'||m=='bank')?'البنك':0;
 const pt=id=>(D.partners.find(p=>p.id==id)||{}).kind;
 D.invoices.filter(v=>ok(v.date)).forEach(v=>{
  // إصلاح 4: تكلفة البضاعة من items.cost
  const cg=D.invoice_lines.filter(l=>l.invoice_id==v.id).reduce((s,l)=>{
   const it=D.items.find(x=>x.id==l.item_id)||{};
   return s+(+it.cost||0)*l.qty;
  },0);
  const t=+v.total,c=v.kind.startsWith('sale'),e=(s,d,cr,a)=>J.push([v.date,s+' '+v.no,d,cr,a]);
  const pays_=D.invoice_payments.filter(x=>x.invoice_id==v.id);
  const paid=pays_.reduce((s,x)=>s+ +x.amount,0);
  const rem=t-paid,party=c?'العملاء':'الموردون';
  if(v.kind==='sale'){
   pays_.forEach(p=>e('بيع(دفعة)',ac(p.method),'المبيعات',p.amount));
   if(rem>0)e('بيع(آجل)',party,'المبيعات',rem);
   if(+v.tax>0)e('ضريبة','المبيعات','ضريبة القيمة المضافة',+v.tax);
   e('تكلفة بيع','تكلفة المبيعات','المخزون',cg);
  }
  else if(v.kind==='sale_return'){
   e('مرتجع بيع','المبيعات',party,t);
   if(+v.tax!==0)e('ضريبة مرتجع','ضريبة القيمة المضافة','المبيعات',+v.tax);
   e('تكلفة مرتجع','المخزون','تكلفة المبيعات',cg);
  }
  else if(v.kind==='purchase'){
   // إصلاح 11: احترام الدفعات
   if(paid>0)pays_.forEach(p=>e('شراء(دفعة)','المخزون',ac(p.method)||party,p.amount));
   if(rem>0)e('شراء(آجل)','المخزون',party,rem);
  }
  else if(v.kind==='purchase_return'){
   if(paid>0)pays_.forEach(p=>e('مرتجع شراء(دفعة)',ac(p.method)||party,'المخزون',p.amount));
   if(rem>0)e('مرتجع شراء(آجل)',party,'المخزون',rem);
  }
  else if(v.kind==='opening'){
   e('مخزون افتتاحي','المخزون','رأس المال',t);
  }
 });
 D.payments.filter(x=>ok(x.date)).forEach(x=>{const a=ac(x.method)||'الصندوق',k=pt(x.partner_id),m=+x.amount;
  if(!x.partner_id)J.push([x.date,m>0?'رأس مال':'مسحوبات',m>0?a:'رأس المال',m>0?'رأس المال':a,Math.abs(m)]);
  else if(k=='customer')J.push([x.date,'تحصيل من '+nm('partners',x.partner_id),a,'العملاء',m]);else J.push([x.date,'سداد إلى '+nm('partners',x.partner_id),'الموردون',a,m])});
 D.expenses.filter(x=>ok(x.date)).forEach(x=>J.push([x.date,'مصروف: '+x.name,'المصروفات',ac(x.method)||'الصندوق',+x.amount]));
 (D.manual_journal||[]).filter(x=>ok(x.date)).forEach(x=>J.push([x.date,'قيد يدوي: '+(x.memo||''),x.debit_account,x.credit_account,+x.amount]));
 return J.sort((a,b)=>a[0]<b[0]?-1:1)}
function calc(from,to){const b={};journal(from,to).forEach(e=>{b[e[2]]=(b[e[2]]||0)+e[4];b[e[3]]=(b[e[3]]||0)-e[4]});const g=k=>b[k]||0,rev=-g('المبيعات'),cg=g('تكلفة المبيعات'),ex=g('المصروفات');
 const as=[['الصندوق',g('الصندوق')],['البنك',g('البنك')],['العملاء',g('العملاء')],['المخزون',g('المخزون')]];return{b,rev,cg,ex,net:rev-cg-ex,as,ta:as.reduce((s,x)=>s+x[1],0),ap:-g('الموردون'),vat:-g('ضريبة القيمة المضافة'),cap:-g('رأس المال')}}

 if(m=='pm'){const o={};D.invoice_payments.forEach(p=>{const v=D.invoices.find(x=>x.id==p.invoice_id);if(!v||v.kind!='sale'||(a&&v.date<a)||v.date>t)return;o[p.method]=(o[p.method]||0)+ +p.amount});h+='<h3>مبيعات حسب طريقة الدفع</h3>'+tbl(['الطريقة','المبلغ'],Object.entries(o).map(([k,v])=>[PM[k]||k,f(v)]))}

  h+='<h3>أعمار الديون</h3>'+tbl(['فاتورة','العميل','التاريخ','الفئة','المتبقي'],rows.map(r=>[r[0],r[1],r[2],r[3],f(r[4])]))}
 if(m=='pu'){const o={};D.invoices.filter(v=>v.kind=='purchase'&&(!a||v.date>=a)&&v.date<=t).forEach(v=>{const n=nm('partners',v.partner_id);o[n]=(o[n]||0)+ +v.total});h+='<h3>المشتريات حسب المورد</h3>'+tbl(['المورد','الإجمالي'],Object.entries(o).map(([k,v])=>[esc(k),f(v)]))}

  D.payments.filter(x=>x.partner_id==p.id).forEach(x=>W.push([x.date,'دفعة',cu?0:+x.amount,cu?+x.amount:0]));W.sort((x,y)=>x[0]<y[0]?-1:1);let bal=0;
  h+=`<h3>كشف حساب: ${esc(p.name)}</h3>`+tbl(['التاريخ','البيان','مدين','دائن','الرصيد'],W.map(r=>{bal+=cu?r[2]-r[3]:r[3]-r[2];return[r[0],esc(r[1]),f(r[2]),f(r[3]),f(bal)]}))}
 $('rp').innerHTML=H(h)}
